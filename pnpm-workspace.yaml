packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # Only copies the browser service worker, which the web tests never use.
  msw: false
  '@parcel/watcher': set this to true or false
  unrs-resolver: set this to true or false
