packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # Only copies the browser service worker, which the web tests never use.
  msw: false
  # Metro's file watcher and its native module resolver.
  "@parcel/watcher": true
  unrs-resolver: true
