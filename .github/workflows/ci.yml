# Everything this repository already claims to verify, run by a machine.
#
# Fifty-nine commits and 1339 tests went in without this file, which means
# every one of those tests was green exactly once, on one laptop, at the moment
# somebody chose to run it. A suite nobody runs is not a safety net, it is a
# document that claims to be executable — and the first time that claim is
# tested is the worst possible time to find out it was stale.
#
# The whole job is `install`, `typecheck`, `test`. What takes explaining is not
# the three commands; it is the several ways each of them can succeed while
# proving nothing.

name: CI

on:
  # Both triggers, deliberately.
  #
  # `pull_request` is what a review needs. `push` is what the work in this
  # repository actually looks like: branches pushed and merged without a pull
  # request ever existing. Keeping only `pull_request` would leave that
  # entirely unverified, which is the exact hole this file was added to close.
  #
  # The cost is that a push to a branch with an open pull request runs the job
  # twice. That is some wasted minutes; the alternative is a whole branch
  # nobody checked.
  push:
  pull_request:

# A superseded push has nothing left to prove, so it stops rather than queuing
# behind the answer that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job reads the repository and writes nothing anywhere. It has no reason
# to hold a token that could.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck and test
    runs-on: ubuntu-latest
    # The whole sequence is about a minute of real work. Twenty is not a
    # budget, it is the point at which something has hung and should be killed
    # rather than billed.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm and Node in one step, and neither version is written here.
      #
      # The pnpm version is read from `packageManager` in the root
      # package.json, which is the one place that already decides it. A second
      # copy in this file is a second thing to forget on the day it moves, and
      # a CI run on a different pnpm than the one everybody develops on is a CI
      # run answering a question nobody asked.
      #
      # `node@22` is not arbitrary either: it is what `docker/api.Dockerfile`
      # builds and runs (`ARG NODE_VERSION=22-bookworm-slim`). CI proving a
      # different major than the container on the homelab box would be CI
      # proving the wrong thing.
      #
      # `cache: true` caches the pnpm STORE — not `node_modules` — keyed on the
      # hash of pnpm-lock.yaml. That is the shape of cache that cannot lie: the
      # store is content addressed, and the install below is
      # `--frozen-lockfile`, so the lockfile decides what is installed and the
      # cache only ever decides how long it takes to put it there. A stale or
      # missing cache costs seconds, never a different answer.
      #
      # `install: false` because the install is the interesting step and gets
      # to be visible, with its flags, below.
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false

      # No `--ignore-scripts`, and that omission is the entire point of this
      # step.
      #
      # Two things have to happen during this install, and both of them are
      # install scripts:
      #
      # 1. `pnpm-workspace.yaml` lists six packages under `allowBuilds` whose
      #    scripts must run — esbuild, prisma, `@prisma/client`,
      #    `@prisma/engines`, `@parcel/watcher` and unrs-resolver. They are the
      #    query engine the API talks to SQLite through, the transform Vite and
      #    Metro compile with, and Metro's file watcher.
      # 2. `apps/api` has a `postinstall` of its own that runs
      #    `prisma generate`. It does fire here — verified, not assumed, by
      #    running this exact command on a clean checkout.
      #
      # An install that holds any of that back still exits 0 and still prints a
      # perfectly healthy summary. Nothing about it looks wrong. What breaks is
      # everything after it, and `docker/api.Dockerfile` is the proof this is a
      # real trap rather than a theoretical one: it passes `--ignore-scripts`
      # on purpose, and has to run the generator by hand afterwards.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Already done by the `postinstall` above. Here anyway, because this is
      # the ordering the next step depends on and a comment is a weaker way to
      # say so than a line in the log.
      #
      # `apps/api` imports `PrismaClient`, `Prisma`, `Item` and friends from
      # `@prisma/client`, and none of those exist on disk until the generator
      # has read prisma/schema.prisma and written them. Skip it and `tsc`
      # answers with twenty-odd `TS2305: has no exported member` errors that
      # name every persistence file and explain nothing. It is idempotent and
      # takes under a tenth of a second, which is a cheap price for never
      # having to debug that message.
      - name: Generate the Prisma client
        run: pnpm --filter @waymark/api exec prisma generate

      # `tsc --noEmit` in all six workspace projects.
      - name: Typecheck
        run: pnpm typecheck

      # `pnpm -r test`, which is two different test runners.
      #
      # vitest runs in packages/domain, packages/domain-contract-tests,
      # packages/api-client, apps/api and apps/web. jest runs in apps/mobile,
      # because Expo's transform pipeline is jest's and jest-expo is what knows
      # how to compile React Native. Both are spawned by the same recursive
      # script, and a failure in either exits non-zero — including jest, which
      # is the one worth checking, being the odd runner out.
      #
      # That non-zero is the only property that makes this whole file worth
      # having. A workflow that reports success on a failed step is worse than
      # no workflow, because it converts "nobody checked" into "somebody
      # checked and it was fine".
      - name: Test
        run: pnpm test

  image:
    name: build the image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The only step in this file that can catch a whole class of failure the
      # other job is blind to.
      #
      # `docker/api.Dockerfile` does not copy the workspace. It enumerates the
      # packages it needs, by hand, twice — once for the manifests so that a
      # dependency change alone does not bust the install layer, and once for
      # the sources. That hand-kept list is the price of the layer cache, and
      # it goes stale the moment somebody adds a package.
      #
      # Which is exactly what happened: `packages/i18n` was written, the whole
      # suite stayed green, `pnpm typecheck` stayed green, `vite build` stayed
      # green on a developer machine — and the image failed to build, because
      # inside it `@waymark/i18n` did not exist. Nothing before this step could
      # see it, because every one of them runs against the complete workspace.
      # Running `vite build` in CI would NOT have caught it either.
      #
      # So this builds the real image from the real Dockerfile. It is slower
      # than everything above it put together, and it is the step that answers
      # "will this deploy".
      # `--build-arg WAYMARK_COMMIT` is not decoration here. It is the value the
      # next step asserts on, so this job builds the image the same way a deploy
      # builds it rather than a variant of it.
      - name: Build the API image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            --build-arg WAYMARK_COMMIT="${{ github.sha }}" \
            -t waymark-api:ci .

      # Building is not running, and the step above could never tell the
      # difference.
      #
      # An image that builds and then dies on boot passed this job until today.
      # Everything between `docker build` succeeding and the app being reachable
      # was unverified: the entrypoint's `prisma migrate deploy`, the Prisma
      # query engine matching the runtime's OpenSSL, `createWebClient` finding a
      # build at `WAYMARK_WEB_ROOT`, the server binding a port at all. Each of
      # those has its own way of failing only in the container.
      #
      # It runs with NO environment at all — no compose file, no variables —
      # which is the stronger claim: the image's own baked-in defaults are a
      # complete, working configuration.
      #
      # And it asserts the commit, which makes the deploy gate's one assumption
      # true by test rather than by hope. `scripts/deploy.sh` proves a release
      # by asking the running container which commit it is; if that plumbing
      # ever breaks — an `ARG` not redeclared in the runtime stage, a renamed
      # variable — the deploy would refuse every time and nobody would know
      # which half was wrong. This is the half that gets checked first.
      - name: Run it, and make it say which commit it is
        run: |
          docker run --detach --name waymark-ci \
            --publish 127.0.0.1:3000:3000 \
            waymark-api:ci

          health=''
          for _ in $(seq 1 60); do
            if health=$(curl --silent --show-error --max-time 3 http://127.0.0.1:3000/health); then
              break
            fi
            health=''
            sleep 2
          done

          if [ -z "$health" ]; then
            echo "The container never answered /health." >&2
            exit 1
          fi

          echo "GET /health -> $health"

          running=$(printf '%s' "$health" | jq -r '.commit // "<null>"')
          if [ "$running" != "${{ github.sha }}" ]; then
            echo "The image reports \"$running\" and was built from ${{ github.sha }}." >&2
            echo "The build argument is not reaching the running process." >&2
            exit 1
          fi

      - name: What the container said, when it went wrong
        if: failure()
        run: docker logs waymark-ci || true

      - name: Stop it
        if: always()
        run: docker rm --force waymark-ci || true
