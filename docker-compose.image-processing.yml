# Background removal, added to the base stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.image-processing.yml up -d --build
#
# Adding the sidecar and telling the API where it is are the same fact, so they
# live in the same file. Remove the flag and the feature is gone: photos already
# processed keep their white background, photos in flight stay PENDING, and
# uploading still works exactly as before.

services:
  api:
    environment:
      # Loopback, and NOT the compose service name. The base file runs the API
      # in the HOST's network namespace (`network_mode: host`, for the rate
      # limiter's sake), and a process there has the host's resolver and the
      # host's routes: `image-processor` does not resolve, and the project
      # network the sidecar lives on is not reachable. The one address of the
      # sidecar the API can reach is a port the host itself owns — the one
      # published below, on loopback.
      #
      # `http://image-processor:8000` was right until the API moved, and then
      # nothing failed at boot: every photo was unreachable, retried, and ended
      # up FAILED. `apps/api/src/http/turning-background-removal-on-reaches-the-
      # sidecar.test.ts` reads both files and watches this relationship.
      WAYMARK_IMAGE_PROCESSOR_URL: http://127.0.0.1:8001

    # There is deliberately NO `depends_on`.
    #
    # Waiting for the sidecar would make the inventory unavailable while a ~180
    # MB model downloads, which is the dependency ADR 4 exists to refuse. The
    # API starts, serves, accepts uploads, finds the sidecar unreachable,
    # retries with a backoff, and gets on with it.

  image-processor:
    build:
      context: ./services/image-processor
    image: waymark-image-processor:latest
    restart: unless-stopped

    environment:
      # `u2netp` is a 4 MB version of the same model for a board that cannot
      # spare the memory, at a visible cost in edge quality.
      REMBG_MODEL: ${REMBG_MODEL:-u2net}
      # One removal at a time inside the container, matching what the API sends.
      REMBG_CONCURRENCY: ${REMBG_CONCURRENCY:-1}
      # Leave a core for the API, the database and the rest of the box. Without
      # this, onnxruntime takes every core it can see and a background nicety
      # makes the primary feature slow.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}

    volumes:
      # The model cache, and the reason this is a named volume rather than a
      # directory in the image: 176 MB downloaded once, kept across every
      # restart and every image upgrade. In the image it would be re-downloaded
      # by each new container, over a home connection, before a single photo
      # could be processed.
      - models:/models

    # Published on the host's loopback and nowhere else, because that is the
    # only way the API — in the host namespace — can reach a container on the
    # project network. 127.0.0.1 and never bare or 0.0.0.0: an unauthenticated
    # image endpoint on every interface would be one for every device in the
    # house, and the only caller that should ever exist is the API on this box.
    #
    # The base file refuses exactly this for the API itself, and the reason does
    # not carry over. `docker-proxy` rewrites the source address of a published
    # port to the bridge gateway, which blinds a rate limiter that must see the
    # real caller. The sidecar has no such question to ask: its only caller is
    # the API, and it does not care what address that call appears to come from.
    #
    # 8001 on the host, because 3000 is the API and 8000 is a common default
    # for anything else a homelab box runs. Change both lines together.
    ports:
      - "127.0.0.1:8001:8000"

    deploy:
      resources:
        limits:
          # A ceiling, not a reservation. rembg is CPU bound and will use
          # everything it is given; this is what keeps "the photo of the drill
          # looks nicer" from making "find the drill" slow.
          cpus: "2.0"
          memory: 2G

volumes:
  models:
